<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYC Weather</title>
<link rel="stylesheet" href="fonts/css/fontawesome.min.css">
<link rel="stylesheet" href="fonts/css/sharp-duotone-solid.min.css">
<style>
/* ── Reset & Base ──────────────────────────────────────────────────────── */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  /* Light-mode palette (oklch) */
  --color-bg:        oklch(0.97 0.005 250);
  --color-surface:   oklch(1.00 0 0);
  --color-text:      oklch(0.20 0.02 250);
  --color-text-dim:  oklch(0.45 0.02 250);
  --color-border:    oklch(0.88 0.01 250);
  --color-accent:    oklch(0.55 0.15 250);   /* nautical blue */
  --color-rising:    oklch(0.55 0.12 160);   /* teal-green */
  --color-falling:   oklch(0.55 0.12 30);    /* warm rust */
  --color-hand:      oklch(0.30 0.05 250);
  --color-dial:      oklch(0.94 0.005 250);
  --color-tick:      oklch(0.50 0.02 250);
  --color-moon-lit:    oklch(0.92 0.03 85);    /* warm white */
  --color-moon-dark:   oklch(0.75 0.02 85);    /* muted tan — unlit side */
  --color-moon-stroke: var(--color-hand);     /* outline for contrast */
  --color-night:       oklch(0.20 0.02 250 / 0.08); /* light mode: night slightly darker */
  --color-daylight:    oklch(0 0 0 / 0);             /* light mode: day is default bg */

  --card-shadow:     0 1px 3px oklch(0 0 0 / 0.08),
                     0 4px 12px oklch(0 0 0 / 0.06);
  --radius:          12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg:        oklch(0.15 0.01 250);
    --color-surface:   oklch(0.22 0.015 250);
    --color-text:      oklch(0.90 0.01 250);
    --color-text-dim:  oklch(0.60 0.015 250);
    --color-border:    oklch(0.32 0.015 250);
    --color-accent:    oklch(0.65 0.15 250);
    --color-rising:    oklch(0.65 0.12 160);
    --color-falling:   oklch(0.65 0.12 30);
    --color-hand:      oklch(0.90 0.03 60);
    --color-dial:      oklch(0.18 0.01 250);
    --color-tick:      oklch(0.55 0.015 250);
    --color-moon-lit:    oklch(0.88 0.04 85);
    --color-moon-dark:   oklch(0.35 0.02 85);    /* dark unlit side on dark dial */
    --color-moon-stroke: transparent;           /* no outline needed on dark dial */
    --color-night:       oklch(0 0 0 / 0);       /* dark mode: night is default bg */
    --color-daylight:    oklch(0.90 0.01 250 / 0.10); /* dark mode: day slightly lighter */

    --card-shadow:     0 1px 3px oklch(0 0 0 / 0.3),
                       0 4px 12px oklch(0 0 0 / 0.25);
  }
}

html {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
}

body {
  min-height: 100dvh;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Header ────────────────────────────────────────────────────────────── */
header {
  text-align: center;
  padding: 1rem 0 0.5rem;
}

header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

header p {
  color: var(--color-text-dim);
  font-size: 0.85rem;
  margin-top: 0.15rem;
}

/* ── Card grid ─────────────────────────────────────────────────────────── */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1rem;
  width: 100%;
  max-width: 900px;
  padding: 1rem 0;
  justify-content: center;
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}

.card h2 {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-text-dim);
}

/* ── Wide card (spans full grid) ───────────────────────────────────────── */
.card-wide {
  grid-column: 1 / -1;
}

/* ── Tide graph ───────────────────────────────────────────────────────── */
#tide-graph-container {
  width: 100%;
}

.tide-graph-svg {
  display: block;
  width: 100%;
  height: auto;
}

/* ── Tide clock SVG ────────────────────────────────────────────────────── */
.tide-clock-svg {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 1;
}

/* ── Tide info text ────────────────────────────────────────────────────── */
.tide-info {
  text-align: center;
  font-size: 0.9rem;
  line-height: 1.5;
}

.tide-info .direction {
  font-weight: 600;
  font-size: 1rem;
}

.tide-info .direction.rising  { color: var(--color-rising); }
.tide-info .direction.falling { color: var(--color-falling); }

.tide-info .next-event {
  color: var(--color-text-dim);
  font-size: 0.85rem;
}

/* ── Wind compass SVG ──────────────────────────────────────────────────── */
.wind-compass-svg {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 1;
}

/* ── Wind info text ────────────────────────────────────────────────────── */
.wind-info {
  text-align: center;
  font-size: 1.35rem;
  line-height: 1.5;
}

.wind-info .wind-current {
  font-weight: 600;
  font-size: 1.5rem;
  color: var(--color-accent);
}

.wind-info .wind-detail {
  color: var(--color-text-dim);
  font-size: 0.85rem;
}

/* ── Current Conditions card ──────────────────────────────────────────── */
#conditions-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
}

.conditions-icon {
  font-size: 12rem;
  line-height: 1;
}

.conditions-temps {
  display: flex;
  align-items: baseline;
  gap: 0.3rem;
  line-height: 1;
}

.conditions-temp {
  font-size: 3.2rem;
  font-weight: 700;
  line-height: 1;
  color: var(--color-text);
}

.conditions-feels {
  font-size: 3.2rem;
  font-weight: 700;
  line-height: 1;
  color: var(--color-text-dim);
}

.conditions-desc {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--color-text);
  text-align: center;
}

/* ── Forecast card ────────────────────────────────────────────────────── */
.forecast-table {
  width: 100%;
  border-collapse: collapse;
}

.forecast-table td {
  padding: 0.45rem 0.375rem;
  vertical-align: middle;
}

.forecast-table .fc-day {
  font-weight: 600;
  font-size: 1.275rem;
  text-transform: uppercase;
  color: var(--color-text);
  text-align: left;
}

.forecast-table .fc-icon {
  font-size: 1.95rem;
  text-align: center;
  width: 3.75rem;
}

.forecast-table .fc-high {
  font-weight: 600;
  font-size: 1.35rem;
  color: var(--color-text);
  text-align: right;
}

.forecast-table .fc-low {
  font-size: 1.275rem;
  color: var(--color-text-dim);
  text-align: right;
}

/* ── Times card ───────────────────────────────────────────────────────── */
.times-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 1.125rem;
}

.times-table td {
  padding: 0.3rem 0.5rem;
  white-space: nowrap;
}

.times-day {
  color: var(--color-text-dim);
  font-size: 1rem;
  width: 2.5rem;
}

.times-time {
  font-variant-numeric: tabular-nums;
  text-align: right;
  padding-right: 0.75rem !important;
}

.times-label {
  color: var(--color-text);
}

<script>
// ── Tide Clock ──────────────────────────────────────────────────────────

/** Fetch hi/lo predictions from our backend. */
async function fetchTides() {
  const res = await fetch('api/tides');
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  // Convert time strings to Date objects
  return data.predictions.map(p => ({
    time: new Date(p.time),
    height: p.height,
    type: p.type,
  }));
}

/**
 * Given sorted hi/lo predictions and a timestamp, find the previous and
 * next events that bracket `now`.
 */
function bracketingEvents(predictions, now) {
  let prev = null;
  let next = null;
  for (const p of predictions) {
    if (p.time <= now) {
      prev = p;
    } else {
      next = p;
      break;
    }
  }
  return { prev, next };
}

/**
 * Compute the tide clock hand angle (degrees, 0 = 12-o'clock / high tide,
 * increasing clockwise).
 *
 *   High → Low (falling):  0° → 180°
 *   Low  → High (rising): 180° → 360°
 *
 * Uses cosine easing so the hand moves faster mid-cycle and slows near
 * the extremes, mimicking the sinusoidal shape of real tides.
 */
function tideAngle(prev, next, now) {
  const elapsed = now - prev.time;
  const duration = next.time - prev.time;
  const progress = Math.max(0, Math.min(1, elapsed / duration));

  // Cosine easing: slow at endpoints, fast in the middle
  const eased = (1 - Math.cos(progress * Math.PI)) / 2;

  if (prev.type === 'H') {
    // Falling: high (0°) → low (180°)
    return eased * 180;
  } else {
    // Rising: low (180°) → high (360°)
    return 180 + eased * 180;
  }
}

// ── SVG clock face builder ──────────────────────────────────────────────

function buildClockSVG() {
  const ns = 'http://www.w3.org/2000/svg';
  const size = 320;
  const cx = size / 2;
  const cy = size / 2;
  const outerR = 148;
  const arcR = 138;            // colored band sits just inside the rim
  const tickOuterR = 130;      // ticks start inside the arc band
  const tickInnerMajor = 115;
  const tickInnerMinor = 121;
  const numberR = 108;         // hour numbers (near tick marks)
  const hiloLabelR = 120;      // HIGH / LOW text (between ticks and numbers)
  const labelR = 52;           // RISING / FALLING text (inner area)
  const handTipR = 90;         // hand tip — moon (r=10) rides inside numbers

  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.classList.add('tide-clock-svg');

  // Helper: polar to cartesian (0° = 12 o'clock, CW positive)
  const polar = (angle, r) => ({
    x: cx + r * Math.sin(angle * Math.PI / 180),
    y: cy - r * Math.cos(angle * Math.PI / 180),
  });

  // Helper: create SVG element with attributes
  const el = (tag, attrs) => {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  // --- Dial background ---
  svg.appendChild(el('circle', {
    cx, cy, r: outerR,
    fill: 'var(--color-dial)',
    stroke: 'var(--color-border)',
    'stroke-width': '2',
  }));

  // --- Colored arcs: falling (right) and rising (left) ---
  // Wide bands along the outer rim
  svg.appendChild(el('path', {
    d: `M ${cx} ${cy - arcR} A ${arcR} ${arcR} 0 0 1 ${cx} ${cy + arcR}`,
    fill: 'none',
    stroke: 'var(--color-falling)',
    'stroke-width': '8',
    opacity: '0.18',
  }));

  svg.appendChild(el('path', {
    d: `M ${cx} ${cy + arcR} A ${arcR} ${arcR} 0 0 1 ${cx} ${cy - arcR}`,
    fill: 'none',
    stroke: 'var(--color-rising)',
    'stroke-width': '8',
    opacity: '0.18',
  }));

  // --- Tick marks (12 ticks = every 30°) ---
  for (let i = 0; i < 12; i++) {
    const angle = i * 30;
    const isCardinal = (i === 0 || i === 6);   // HIGH / LOW positions
    const isQuarter = (i === 3 || i === 9);     // 3-hour marks
    const inner = tickInnerMinor;
    const width = isCardinal ? '2.5' : isQuarter ? '2' : '1.2';
    const p1 = polar(angle, tickOuterR);
    const p2 = polar(angle, inner);
    svg.appendChild(el('line', {
      x1: p1.x, y1: p1.y,
      x2: p2.x, y2: p2.y,
      stroke: 'var(--color-tick)',
      'stroke-width': width,
      'stroke-linecap': 'round',
    }));
  }

  // --- Text labels ---
  const textStyle = {
    'text-anchor': 'middle',
    'dominant-baseline': 'central',
    'font-family': 'system-ui, -apple-system, sans-serif',
    fill: 'var(--color-text)',
  };

  // HIGH at top (same ring as hour numbers)
  const highLabel = el('text', {
    x: cx, y: cy - numberR,
    ...textStyle,
    'font-size': '10',
    'font-weight': '700',
    'letter-spacing': '0.08em',
  });
  highLabel.textContent = 'HIGH';
  svg.appendChild(highLabel);

  // LOW at bottom (same ring as hour numbers)
  const lowLabel = el('text', {
    x: cx, y: cy + numberR,
    ...textStyle,
    'font-size': '10',
    'font-weight': '700',
    'letter-spacing': '0.08em',
  });
  lowLabel.textContent = 'LOW';
  svg.appendChild(lowLabel);

  // Hour numbers 1–5 on each side
  for (let h = 1; h <= 5; h++) {
    // Right side (falling): hours until low
    const rp = polar(h * 30, numberR);
    const rn = el('text', {
      x: rp.x, y: rp.y, ...textStyle,
      'font-size': '13', 'font-weight': '400',
      fill: 'var(--color-text-dim)',
    });
    rn.textContent = String(h);
    svg.appendChild(rn);

    // Left side (rising): hours until high
    const lp = polar(360 - h * 30, numberR);
    const ln = el('text', {
      x: lp.x, y: lp.y, ...textStyle,
      'font-size': '13', 'font-weight': '400',
      fill: 'var(--color-text-dim)',
    });
    ln.textContent = String(h);
    svg.appendChild(ln);
  }

  // FALLING / RISING labels (inside the number ring)
  const fallingLabel = el('text', {
    x: polar(90, labelR).x, y: polar(90, labelR).y,
    ...textStyle,
    'font-size': '9',
    'font-weight': '600',
    'letter-spacing': '0.12em',
    fill: 'var(--color-falling)',
    opacity: '0.6',
  });
  fallingLabel.textContent = 'FALLING';
  svg.appendChild(fallingLabel);

  const risingLabel = el('text', {
    x: polar(270, labelR).x, y: polar(270, labelR).y,
    ...textStyle,
    'font-size': '9',
    'font-weight': '600',
    'letter-spacing': '0.12em',
    fill: 'var(--color-rising)',
    opacity: '0.6',
  });
  risingLabel.textContent = 'RISING';
  svg.appendChild(risingLabel);

  // --- Current water level readout (lower half, below hand in z-order) ---
  const levelText = el('text', {
    id: 'tide-level',
    x: cx,
    y: cy + 48,
    ...textStyle,
    'font-size': '32',
    'font-weight': '700',
    fill: 'var(--color-text)',
    opacity: '0.85',
  });
  levelText.textContent = '';
  svg.appendChild(levelText);

  const levelUnit = el('text', {
    id: 'tide-level-unit',
    x: cx,
    y: cy + 70,
    ...textStyle,
    'font-size': '11',
    'font-weight': '500',
    fill: 'var(--color-text-dim)',
    opacity: '0.7',
  });
  levelUnit.textContent = '';
  svg.appendChild(levelUnit);

  // --- Hand (rotated dynamically) ---
  const handGroup = document.createElementNS(ns, 'g');
  handGroup.setAttribute('id', 'tide-hand');
  handGroup.style.transformOrigin = `${cx}px ${cy}px`;
  handGroup.style.transition = 'transform 1s ease-in-out';

  // Tail (short counterweight below center)
  handGroup.appendChild(el('line', {
    x1: cx, y1: cy + 22,
    x2: cx, y2: cy,
    stroke: 'var(--color-hand)',
    'stroke-width': '4',
    'stroke-linecap': 'round',
  }));

  // Shaft (ends at the moon circle edge)
  const moonR = 10;
  const moonCY = cy - handTipR;
  handGroup.appendChild(el('line', {
    x1: cx, y1: cy,
    x2: cx, y2: moonCY + moonR,
    stroke: 'var(--color-hand)',
    'stroke-width': '3',
    'stroke-linecap': 'round',
  }));

  // Moon phase disc at tip of hand (counter-rotated to stay upright)
  const moonGroup = document.createElementNS(ns, 'g');
  moonGroup.setAttribute('id', 'moon-group');
  moonGroup.style.transformOrigin = `${cx}px ${moonCY}px`;
  moonGroup.style.transition = 'transform 1s ease-in-out';

  // Base circle — the unlit (dark) side of the moon
  moonGroup.appendChild(el('circle', {
    cx, cy: moonCY, r: moonR,
    fill: 'var(--color-moon-dark)',
  }));

  // Lit portion at full opacity (path updated dynamically)
  moonGroup.appendChild(el('path', {
    id: 'moon-phase-path',
    d: '',
    fill: 'var(--color-moon-lit)',
  }));

  // Thin outline for contrast (visible in light mode, transparent in dark)
  moonGroup.appendChild(el('circle', {
    cx, cy: moonCY, r: moonR,
    fill: 'none',
    stroke: 'var(--color-moon-stroke)',
    'stroke-width': '1',
  }));

  handGroup.appendChild(moonGroup);

  svg.appendChild(handGroup);

  // --- Center hub (on top of hand) ---
  svg.appendChild(el('circle', {
    cx, cy, r: 5,
    fill: 'var(--color-hand)',
  }));

  return svg;
}

// ── Update loop ─────────────────────────────────────────────────────────

let predictions = [];

/** Track the cumulative hand rotation so CSS transitions always take the
 *  shortest arc, even when crossing the 360°→0° boundary. */
let currentHandAngle = null;

function updateClock() {
  if (!predictions.length) return;

  const now = new Date();
  const { prev, next } = bracketingEvents(predictions, now);

  if (!prev || !next) {
    // Can happen briefly around midnight; will fix on next fetch
    return;
  }

  const targetAngle = tideAngle(prev, next, now);
  const hand = document.getElementById('tide-hand');
  if (!hand) return;

  if (currentHandAngle === null) {
    // First render — jump without animation
    currentHandAngle = targetAngle;
  } else {
    // Compute shortest-arc delta, accounting for the 360°/0° wrap
    let delta = targetAngle - (((currentHandAngle % 360) + 360) % 360);
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    currentHandAngle += delta;
  }

  hand.style.transform = `rotate(${currentHandAngle}deg)`;

  // Counter-rotate the moon so it stays upright
  const moonG = document.getElementById('moon-group');
  if (moonG) moonG.style.transform = `rotate(${-currentHandAngle}deg)`;

  // Update info text
  const infoEl = document.getElementById('tide-info');
  if (infoEl) {
    infoEl.hidden = false;

    const isFalling = prev.type === 'H';
    const dirClass = isFalling ? 'falling' : 'rising';
    const dirText = isFalling ? 'Falling' : 'Rising';

    const nextType = next.type === 'H' ? 'High' : 'Low';
    const nextTimeStr = next.time.toLocaleTimeString('en-US', {
      hour: 'numeric',
      minute: '2-digit',
    });

    infoEl.innerHTML = `
      <div class="direction ${dirClass}">${dirText}</div>
      <div class="next-event">Next ${nextType}: ${nextTimeStr} (${next.height.toFixed(1)} ft)</div>
    `;
  }
}

/** Fetch the latest water level from Providence (station 8454000). */
async function refreshWaterLevel() {
  try {

// ── Moon Phase ──────────────────────────────────────────────────────────

/**
 * Calculate the moon phase for a given date.
 * Uses a known new-moon reference and the synodic month constant.
 * @param {Date} date
 * @returns {number} 0–1 where 0 = new moon, 0.5 = full moon
 */
function moonPhase(date = new Date()) {
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14); // Jan 6 2000, 18:14 UTC
  const synodicMonth = 29.530588853 * 86400000;       // ms
  const elapsed = date.getTime() - knownNewMoon;
  const phase = (elapsed % synodicMonth) / synodicMonth;
  return phase < 0 ? phase + 1 : phase;
}

/**
 * Build an SVG path `d` string for the illuminated portion of the moon.
 * Northern Hemisphere convention: right side lights up first (waxing).
 *
 * @param {number} phase  0–1 (0 = new, 0.5 = full)
 * @param {number} mx     center x
 * @param {number} my     center y
 * @param {number} r      radius
 * @returns {string} SVG path d attribute
 */
function moonPhasePath(phase, mx, my, r) {
  // Terminator curvature: +1 at new, 0 at quarters, −1 at full
  const sweep = Math.cos(phase * 2 * Math.PI);
  const rx = Math.abs(sweep) * r;

  const top = `${mx} ${my - r}`;
  const bot = `${mx} ${my + r}`;

  if (phase <= 0) {
    // New moon — entirely dark
    return '';
  }
  if (phase >= 1) {
    // Also new moon (cycle wrap)
    return '';
  }
  if (Math.abs(phase - 0.5) < 0.001) {
    // Full moon — full circle
    return `M ${mx} ${my - r} A ${r} ${r} 0 1 0 ${mx} ${my + r} A ${r} ${r} 0 1 0 ${mx} ${my - r}`;
  }

  if (phase < 0.25) {
    // Waxing crescent: small right-side lit
    return `M ${top} A ${r} ${r} 0 0 1 ${bot} A ${rx} ${r} 0 0 1 ${top}`;
  } else if (phase < 0.5) {
    // Waxing gibbous: large right-side lit
    return `M ${top} A ${r} ${r} 0 0 1 ${bot} A ${rx} ${r} 0 0 0 ${top}`;
  } else if (phase < 0.75) {
    // Waning gibbous: large left-side lit
    return `M ${top} A ${r} ${r} 0 0 0 ${bot} A ${rx} ${r} 0 0 1 ${top}`;
  } else {
    // Waning crescent: small left-side lit
    return `M ${top} A ${r} ${r} 0 0 0 ${bot} A ${rx} ${r} 0 0 0 ${top}`;
  }
}

/** Update the moon phase disc on the tide clock hand. */
function updateMoonPhase() {
  const pathEl = document.getElementById('moon-phase-path');
  if (!pathEl) return;

  const phase = moonPhase();
  // Moon center is at (cx, cy - handTipR) in clock coordinates = (160, 70)
  const d = moonPhasePath(phase, 160, 70, 10);
  pathEl.setAttribute('d', d);
}

  const entry = NWS_ICON_MAP[condition];
  if (!entry) return 'fa-cloud';
  return entry[timeOfDay] || entry.day;

// ── Tide Graph ──────────────────────────────────────────────────────────

/**
 * Build an SVG tide graph showing predicted curve and measured water levels.
 *
 * @param {{ time: string, height: number }[]} curve      Prediction curve (~240 pts)
 * @param {{ time: string, v: string }[]}      measured   Measured water levels
 * @returns {SVGSVGElement}
 */
function buildTideGraphSVG(curve, measured, nauticalTimes) {
  const ns = 'http://www.w3.org/2000/svg';

  // ── Layout constants ──────────────────────────────────────────────────
  const W = 800, H = 400;
  const ml = 45, mr = 10, mt = 25, mb = 30;   // margins
  const plotW = W - ml - mr;
  const plotH = H - mt - mb;

  // ── Time domain: midnight to midnight (local) ─────────────────────────
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const t0 = today.getTime();
  const t1 = t0 + 24 * 60 * 60 * 1000;

  const xOf = (ms) => ml + ((ms - t0) / (t1 - t0)) * plotW;

  // ── Height domain: auto-scale from prediction data ────────────────────
  let hMin = Infinity, hMax = -Infinity;
  for (const p of curve) {
    if (p.height < hMin) hMin = p.height;
    if (p.height > hMax) hMax = p.height;
  }
  // Pad by 0.5 ft and round to nice boundaries
  hMin = Math.floor(hMin * 2 - 1) / 2;  // round down to nearest 0.5
  hMax = Math.ceil(hMax * 2 + 1) / 2;   // round up to nearest 0.5

  const yOf = (h) => mt + plotH - ((h - hMin) / (hMax - hMin)) * plotH;

  // ── Helpers ───────────────────────────────────────────────────────────
  const el = (tag, attrs) => {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.classList.add('tide-graph-svg');

  // ── Grid lines & Y-axis labels ────────────────────────────────────────
  // Horizontal grid lines at each whole foot
  for (let h = Math.ceil(hMin); h <= Math.floor(hMax); h++) {
    const y = yOf(h);
    const isZero = h === 0;
    svg.appendChild(el('line', {
      x1: ml, y1: y, x2: W - mr, y2: y,
      stroke: isZero ? 'var(--color-text-dim)' : 'var(--color-border)',
      'stroke-width': isZero ? '1' : '0.5',
    }));
    svg.appendChild(el('text', {
      x: ml - 6, y: y,
      'text-anchor': 'end',
      'dominant-baseline': 'middle',
      fill: 'var(--color-text-dim)',
      'font-size': '11',
    })).textContent = `${h}`;
  }

  // Y-axis unit label
  const yLabel = el('text', {
    x: 8, y: mt + plotH / 2,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    fill: 'var(--color-text-dim)',
    'font-size': '10',
    transform: `rotate(-90, 8, ${mt + plotH / 2})`,
  });
  yLabel.textContent = 'ft MLLW';
  svg.appendChild(yLabel);

  // ── X-axis tick marks & labels (every 3 hours) ────────────────────────
  const xLabels = [
    '12a','3a','6a','9a','12p','3p','6p','9p',
  ];
  for (let i = 0; i < 8; i++) {
    const ms = t0 + i * 3 * 60 * 60 * 1000;
    const x = xOf(ms);

    // Vertical grid line
    svg.appendChild(el('line', {
      x1: x, y1: mt, x2: x, y2: mt + plotH,
      stroke: 'var(--color-border)',
      'stroke-width': '0.5',
    }));

    // Time label
    svg.appendChild(el('text', {
      x, y: H - mb + 16,
      'text-anchor': 'middle',
      fill: 'var(--color-text-dim)',
      'font-size': '11',
    })).textContent = xLabels[i];
  }

  // ── Nautical daylight / night shading ─────────────────────────────────
  // All three rects are always drawn; CSS variables control which are
  // visible so the graph responds to light/dark mode without rebuilding.
  //   --color-night:    visible in light mode, transparent in dark mode
  //   --color-daylight: visible in dark mode, transparent in light mode
  if (nauticalTimes) {
    const dawnMs = nauticalTimes.dawn ? new Date(nauticalTimes.dawn).getTime() : null;
    const duskMs = nauticalTimes.dusk ? new Date(nauticalTimes.dusk).getTime() : null;

    // Pre-dawn night
    if (dawnMs) {
      const xDawn = Math.min(xOf(dawnMs), ml + plotW);
      if (xDawn > ml) {
        svg.appendChild(el('rect', {
          x: ml, y: mt, width: xDawn - ml, height: plotH,
          fill: 'var(--color-night)',
        }));
      }
    }

    // Daylight band
    if (dawnMs && duskMs) {
      const x1 = Math.max(xOf(dawnMs), ml);
      const x2 = Math.min(xOf(duskMs), ml + plotW);
      if (x2 > x1) {
        svg.appendChild(el('rect', {
          x: x1, y: mt, width: x2 - x1, height: plotH,
          fill: 'var(--color-daylight)',
        }));
      }
    }

    // Post-dusk night
    if (duskMs) {
      const xDusk = Math.max(xOf(duskMs), ml);
      const xEnd = ml + plotW;
      if (xDusk < xEnd) {
        svg.appendChild(el('rect', {
          x: xDusk, y: mt, width: xEnd - xDusk, height: plotH,
          fill: 'var(--color-night)',
        }));
      }
    }
  }

  // ── Plot border ───────────────────────────────────────────────────────
  svg.appendChild(el('rect', {
    x: ml, y: mt, width: plotW, height: plotH,
    fill: 'none',
    stroke: 'var(--color-border)',
    'stroke-width': '1',
  }));

  // ── Prediction curve ──────────────────────────────────────────────────
  if (curve.length > 1) {
    let d = '';
    for (let i = 0; i < curve.length; i++) {
      const ms = new Date(curve[i].time).getTime();
      if (ms < t0 || ms > t1) continue;
      const x = xOf(ms);
      const y = yOf(curve[i].height);
      d += (d === '' ? `M${x},${y}` : ` L${x},${y}`);
    }
    svg.appendChild(el('path', {
      d,
      fill: 'none',
      stroke: 'var(--color-text-dim)',
      'stroke-width': '1.5',
      'stroke-opacity': '0.5',
    }));
  }

  // ── High/Low labels on prediction curve ───────────────────────────────
  // Find local peaks and troughs
  for (let i = 1; i < curve.length - 1; i++) {
    const prev = curve[i - 1].height;
    const curr = curve[i].height;
    const next = curve[i + 1].height;
    const ms = new Date(curve[i].time).getTime();
    if (ms < t0 || ms > t1) continue;

    const isPeak = curr > prev && curr >= next;
    const isTrough = curr < prev && curr <= next;
    if (!isPeak && !isTrough) continue;

    const x = xOf(ms);
    const y = yOf(curr);
    const label = el('text', {
      x,
      y: isPeak ? y - 6 : y + 13,
      'text-anchor': 'middle',
      fill: 'var(--color-text-dim)',
      'font-size': '10',
      'font-weight': '600',
    });
    label.textContent = curr.toFixed(1);
    svg.appendChild(label);
  }

  // ── Measured water level ──────────────────────────────────────────────
  if (measured.length > 1) {
    let d = '';
    for (const obs of measured) {
      const ms = new Date(obs.time).getTime();
      if (ms < t0 || ms > t1) continue;
      const h = parseFloat(obs.v);
      if (Number.isNaN(h)) continue;
      const x = xOf(ms);
      const y = yOf(h);
      d += (d === '' ? `M${x},${y}` : ` L${x},${y}`);
    }
    if (d) {
      svg.appendChild(el('path', {
        d,
        fill: 'none',
        stroke: 'var(--color-accent)',
        'stroke-width': '2',
      }));
    }
  }

  // ── Current-time marker ───────────────────────────────────────────────
  const nowMs = Date.now();
  if (nowMs >= t0 && nowMs <= t1) {
    const x = xOf(nowMs);
    svg.appendChild(el('line', {
      x1: x, y1: mt, x2: x, y2: mt + plotH,
      stroke: 'var(--color-accent)',
      'stroke-width': '1',
      'stroke-dasharray': '4,3',
    }));
  }

  return svg;
}

/** Fetch tide curve + measured data and rebuild the graph. */
async function refreshTideGraph() {
  try {
    console.log('[tide-graph] Refreshing…');
    const [curveRes, daylightRes] = await Promise.all([
      fetch('api/tide-curve'),
      fetch('api/daylight'),
    ]);
    if (!curveRes.ok) throw new Error(`API error ${curveRes.status}`);
    const { curve, measured } = await curveRes.json();

    // Get today's nautical dawn/dusk for daylight shading
    const nauticalTimes = daylightRes.ok ? await daylightRes.json() : null;

    console.log(`[tide-graph] ${curve.length} prediction pts, ${measured.length} measured pts`);
    const container = document.getElementById('tide-graph-container');
    container.innerHTML = '';
    container.appendChild(buildTideGraphSVG(curve, measured, nauticalTimes));
  } catch (err) {
    console.error('[tide-graph] Refresh failed:', err);
  }
}

// ── Wind Compass ────────────────────────────────────────────────────────

/** Wind source definitions.  Each gets its own hue on the compass. */
const WIND_SOURCES = [
  { station: '8453662', label: 'NOAA Providence', hue: 250 },
  // Future: { station: 'wunderground', label: 'EYC PWS', hue: 30 },
];

/** Fetch wind observations for a single station. */
async function fetchWindData(station) {
  console.log(`[wind] Fetching station ${station}…`);
  const res = await fetch(`api/observations/${station}/wind`);
  if (!res.ok) {
    console.error(`[wind] Station ${station}: HTTP ${res.status} ${res.statusText}`);
    throw new Error(`API error ${res.status}`);
  }
  const json = await res.json();
  console.log(`[wind] Station ${station}: ${json.data?.length ?? 0} observations`);
  if (!json.data || json.data.length === 0) {
    console.warn(`[wind] Station ${station}: empty data array`);
  }
  return json.data.map(d => ({
    time: new Date(d.time),
    speed: parseFloat(d.s) || 0,
    gust: parseFloat(d.g) || 0,
    dir: parseFloat(d.d) || 0,
    dirLabel: d.dr || '',
    station,
  }));
}

/**
 * Fetch wind data from all configured sources and return a merged array
 * sorted by time (oldest first).  Each entry carries its source's hue.
 */
async function fetchAllWind() {
  const sourceMap = new Map(WIND_SOURCES.map(s => [s.station, s]));
  const results = await Promise.allSettled(
    WIND_SOURCES.map(s => fetchWindData(s.station)),
  );

  const merged = [];
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    if (r.status === 'fulfilled') {
      merged.push(...r.value);
    } else {
      console.error(`[wind] Source ${WIND_SOURCES[i].station} failed:`, r.reason);
    }
  }

  console.log(`[wind] Merged total: ${merged.length} observations`);

  // Sort oldest-first so newest draws on top
  merged.sort((a, b) => a.time - b.time);

  // Attach hue from source config
  for (const obs of merged) {
    obs.hue = sourceMap.get(obs.station)?.hue ?? 250;
  }

  return merged;
}

/**
 * Build (or rebuild) the wind compass SVG.
 *
 * @param {object[]} observations  Sorted oldest→newest, each with
 *   speed, gust, dir (degrees), hue (oklch hue angle).
 */
function buildCompassSVG(observations) {
  const ns = 'http://www.w3.org/2000/svg';
  const size = 320;
  const cx = size / 2;
  const cy = size / 2;
  const outerR = 148;
  const plotR = 128;       // max radius for wind segments
  const labelR = 140;      // direction labels
  const ringLabelR = 6;    // offset for speed ring numbers from ring

  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.classList.add('wind-compass-svg');

  // Helpers (same pattern as tide clock)
  const polar = (angleDeg, r) => ({
    x: cx + r * Math.sin(angleDeg * Math.PI / 180),
    y: cy - r * Math.cos(angleDeg * Math.PI / 180),
  });

  const el = (tag, attrs) => {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  const textStyle = {
    'text-anchor': 'middle',
    'dominant-baseline': 'central',
    'font-family': 'system-ui, -apple-system, sans-serif',
  };

  // ── Dial background ───────────────────────────────────────────────────
  svg.appendChild(el('circle', {
    cx, cy, r: outerR,
    fill: 'var(--color-dial)',
    stroke: 'var(--color-border)',
    'stroke-width': '2',
  }));

  // ── Compute speed scale ───────────────────────────────────────────────
  // Find the maximum gust across all observations; fall back to 10 kt
  let maxVal = 0;
  for (const obs of observations) {
    if (obs.gust > maxVal) maxVal = obs.gust;
    if (obs.speed > maxVal) maxVal = obs.speed;
  }
  if (maxVal < 1) maxVal = 10; // sensible default when calm

  // Round up to a nice ring interval (multiples of 5)
  const ringStep = maxVal <= 10 ? 5 : maxVal <= 25 ? 5 : 10;
  const maxRing = Math.ceil(maxVal / ringStep) * ringStep;

  // ── Speed rings ───────────────────────────────────────────────────────
  const numRings = Math.round(maxRing / ringStep);
  for (let i = 1; i <= numRings; i++) {
    const r = (i / numRings) * plotR;
    svg.appendChild(el('circle', {
      cx, cy, r,
      fill: 'none',
      stroke: 'var(--color-tick)',
      'stroke-width': '0.8',
      opacity: '0.5',
    }));

    // Speed label on the north axis (just right of 12-o'clock)
    const speedVal = i * ringStep;
    const labelPos = { x: cx + ringLabelR + 8, y: cy - r };
    const ringLabel = el('text', {
      x: labelPos.x,
      y: labelPos.y,
      ...textStyle,
      'text-anchor': 'start',
      'font-size': '8',
      fill: 'var(--color-text-dim)',
    });
    ringLabel.textContent = String(speedVal);
    svg.appendChild(ringLabel);
  }

  // ── Compass direction labels ──────────────────────────────────────────
  const directions = [
    { label: 'N',  angle: 0 },
    { label: 'NE', angle: 45 },
    { label: 'E',  angle: 90 },
    { label: 'SE', angle: 135 },
    { label: 'S',  angle: 180 },
    { label: 'SW', angle: 225 },
    { label: 'W',  angle: 270 },
    { label: 'NW', angle: 315 },
  ];

  for (const { label, angle } of directions) {
    const isCardinal = label.length === 1;
    const p = polar(angle, labelR);
    const dirLabel = el('text', {
      x: p.x,
      y: p.y,
      ...textStyle,
      'font-size': isCardinal ? '12' : '9',
      'font-weight': isCardinal ? '700' : '400',
      fill: isCardinal ? 'var(--color-text)' : 'var(--color-text-dim)',
    });
    dirLabel.textContent = label;
    svg.appendChild(dirLabel);
  }

  // ── Direction tick marks ──────────────────────────────────────────────
  for (let i = 0; i < 16; i++) {
    const angle = i * 22.5;
    const isCardinal = (i % 4 === 0);      // N, E, S, W
    const isIntercardinal = (i % 2 === 0);  // NE, SE, SW, NW
    if (isCardinal || isIntercardinal) continue; // already have labels there
    const p1 = polar(angle, plotR + 3);
    const p2 = polar(angle, plotR + 8);
    svg.appendChild(el('line', {
      x1: p1.x, y1: p1.y,
      x2: p2.x, y2: p2.y,
      stroke: 'var(--color-tick)',
      'stroke-width': '0.8',
      'stroke-linecap': 'round',
    }));
  }

  // ── Wind segments (oldest first → newest on top) ──────────────────────
  const count = observations.length;
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  for (let i = 0; i < count; i++) {
    const obs = observations[i];
    const alpha = count === 1 ? 1 : 0.2 + 0.8 * (i / (count - 1));
    const lightness = isDark ? 0.7 : 0.5;
    const chroma = isDark ? 0.18 : 0.15;

    const speedR = (obs.speed / maxRing) * plotR;
    const gustR = (obs.gust / maxRing) * plotR;

    const p1 = polar(obs.dir, speedR);
    const p2 = polar(obs.dir, gustR);

    svg.appendChild(el('line', {
      x1: p1.x, y1: p1.y,
      x2: p2.x, y2: p2.y,
      stroke: `oklch(${lightness} ${chroma} ${obs.hue} / ${alpha.toFixed(2)})`,
      'stroke-width': '3',
      'stroke-linecap': 'round',
    }));

    // Small dot at the gust end of the newest observation
    if (i === count - 1) {
      svg.appendChild(el('circle', {
        cx: p2.x, cy: p2.y, r: 4,
        fill: `oklch(${lightness} ${chroma} ${obs.hue})`,
      }));
    }
  }

  // ── Center dot ────────────────────────────────────────────────────────
  svg.appendChild(el('circle', {
    cx, cy, r: 3,
    fill: 'var(--color-tick)',
  }));

  return svg;
}

/**
 * Update the wind info text beneath the compass.
 */
function updateWindInfo(observations) {
  const infoEl = document.getElementById('wind-info');
  if (!infoEl || !observations.length) return;

  infoEl.hidden = false;
  const latest = observations[observations.length - 1];

  const speed = latest.speed.toFixed(1);
  const gust = latest.gust.toFixed(1);
  const speedStr = speed === gust
    ? `${speed} kt`
    : `${speed} – ${gust} kt`;

  infoEl.innerHTML = `
    <div class="wind-current">${latest.dirLabel} ${speedStr}</div>
  `;
}

// ── Wind state & update ─────────────────────────────────────────────────

let windObservations = [];

async function refreshWind() {
  try {
    windObservations = await fetchAllWind();
    if (windObservations.length === 0) {
      console.warn('[wind] No observations after merge — compass will be empty');
    }
    const container = document.getElementById('wind-compass-container');
    container.innerHTML = '';
    container.appendChild(buildCompassSVG(windObservations));
    updateWindInfo(windObservations);
    console.log(`[wind] Compass rebuilt with ${windObservations.length} observations`);
  } catch (err) {
    console.error('[wind] refreshWind failed:', err);
  }
}

// ── Init ────────────────────────────────────────────────────────────────

async function init() {
  const container = document.getElementById('tide-clock-container');

  try {
    predictions = await fetchTides();

    // Build and insert the SVG clock
    container.innerHTML = '';
    container.appendChild(buildClockSVG());

    // Initial update, then tick every 60 s
    updateClock();
    setInterval(updateClock, 60_000);

    // Water level readout — initial fetch + 60 s refresh
    await refreshWaterLevel();
    setInterval(refreshWaterLevel, 60_000);

    // Moon phase on tide hand — update once per hour (changes slowly)
    updateMoonPhase();
    setInterval(updateMoonPhase, 60 * 60_000);

    // Re-fetch tide predictions from API every 5 min (handles day rollover)
    setInterval(async () => {
      try {
        predictions = await fetchTides();
        updateClock();
      } catch (e) {
        console.warn('Tide refresh failed:', e);
      }
    }, 5 * 60_000);

  } catch (err) {
    container.innerHTML = `<p class="status-msg">Unable to load tide data.</p>`;
    console.error('Tide init error:', err);
  }

  // ── Current conditions ──────────────────────────────────────────────
  await refreshConditions();
  setInterval(refreshConditions, 60_000);

  // ── 5-day forecast ────────────────────────────────────────────────
  await refreshForecast();
  setInterval(refreshForecast, 30 * 60_000);

  // ── Times ──────────────────────────────────────────────────────────
  await refreshTimes();
  setInterval(refreshTimes, 5 * 60_000);

  // ── Tide graph ──────────────────────────────────────────────────────
  await refreshTideGraph();
  setInterval(refreshTideGraph, 5 * 60_000);

  // ── Wind compass ────────────────────────────────────────────────────
  await refreshWind();
  setInterval(refreshWind, 60_000);

  // ── Version footer ─────────────────────────────────────────────────
  try {
    const vRes = await fetch('api/version');
    if (vRes.ok) {
      const { version } = await vRes.json();
      document.getElementById('version').textContent = `v${version}`;
    }
  } catch (_) { /* non-critical */ }
}

init();
</script>
