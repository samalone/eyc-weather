<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYC Weather — Icon Color Preview</title>
<link rel="stylesheet" href="fonts/css/fontawesome.min.css">
<link rel="stylesheet" href="fonts/css/sharp-duotone-solid.min.css">
<link rel="stylesheet" href="icon-colors.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   DARK MODE OVERRIDES (class-based, for side-by-side preview)
   ──────────────────────────────────────────────────────────────────────────
   The light-mode .icon-* rules come from the shared icon-colors.css.
   These .dark .icon-* overrides are needed because this page shows both
   modes simultaneously via CSS classes instead of @media queries.
   ══════════════════════════════════════════════════════════════════════════ */

.dark .icon-sun              { --fa-primary-color: oklch(0.82 0.18 70);  --fa-secondary-color: oklch(0.88 0.14 80);  --fa-secondary-opacity: 0.7; }
.dark .icon-moon             { --fa-primary-color: oklch(0.80 0.08 250); --fa-secondary-color: oklch(0.85 0.06 260); --fa-secondary-opacity: 0.6; }
.dark .icon-sun-cloud        { --fa-primary-color: oklch(0.55 0.01 250); --fa-secondary-color: oklch(0.82 0.18 70);  --fa-secondary-opacity: 0.7; }
.dark .icon-moon-cloud       { --fa-primary-color: oklch(0.50 0.01 250); --fa-secondary-color: oklch(0.80 0.08 250); --fa-secondary-opacity: 0.7; }
.dark .icon-cloud-sun        { --fa-primary-color: oklch(0.50 0.01 250); --fa-secondary-color: oklch(0.82 0.18 70);  --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-moon       { --fa-primary-color: oklch(0.50 0.01 250); --fa-secondary-color: oklch(0.80 0.08 250); --fa-secondary-opacity: 0.8; }
.dark .icon-cloud            { --fa-primary-color: oklch(0.50 0.01 250); --fa-secondary-color: oklch(0.62 0.01 250); --fa-secondary-opacity: 0.6; }
.dark .icon-cloud-rain       { --fa-primary-color: oklch(0.45 0.02 250); --fa-secondary-color: oklch(0.65 0.14 250); --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-sun-rain   { --fa-primary-color: oklch(0.48 0.02 250); --fa-secondary-color: oklch(0.75 0.14 70);  --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-moon-rain  { --fa-primary-color: oklch(0.48 0.02 250); --fa-secondary-color: oklch(0.70 0.10 250); --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-snow       { --fa-primary-color: oklch(0.45 0.02 250); --fa-secondary-color: oklch(0.80 0.06 230); --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-sleet      { --fa-primary-color: oklch(0.45 0.02 250); --fa-secondary-color: oklch(0.72 0.08 240); --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-hail       { --fa-primary-color: oklch(0.45 0.02 250); --fa-secondary-color: oklch(0.75 0.06 230); --fa-secondary-opacity: 0.8; }
.dark .icon-cloud-bolt       { --fa-primary-color: oklch(0.35 0.02 250); --fa-secondary-color: oklch(0.88 0.18 85);  --fa-secondary-opacity: 1;   }
.dark .icon-cloud-bolt-sun   { --fa-primary-color: oklch(0.40 0.02 250); --fa-secondary-color: oklch(0.85 0.17 80);  --fa-secondary-opacity: 0.9; }
.dark .icon-cloud-bolt-moon  { --fa-primary-color: oklch(0.40 0.02 250); --fa-secondary-color: oklch(0.83 0.16 85);  --fa-secondary-opacity: 0.9; }
.dark .icon-tornado          { --fa-primary-color: oklch(0.50 0.02 250); --fa-secondary-color: oklch(0.65 0.02 250); --fa-secondary-opacity: 0.7; }
.dark .icon-hurricane        { --fa-primary-color: oklch(0.55 0.12 30);  --fa-secondary-color: oklch(0.65 0.10 30);  --fa-secondary-opacity: 0.7; }
.dark .icon-snow-blowing     { --fa-primary-color: oklch(0.82 0.06 230); --fa-secondary-color: oklch(0.60 0.02 250); --fa-secondary-opacity: 0.7; }
.dark .icon-cloud-fog        { --fa-primary-color: oklch(0.50 0.01 250); --fa-secondary-color: oklch(0.62 0.01 250); --fa-secondary-opacity: 0.5; }
.dark .icon-smog             { --fa-primary-color: oklch(0.50 0.02 70);  --fa-secondary-color: oklch(0.60 0.02 70);  --fa-secondary-opacity: 0.5; }
.dark .icon-sun-haze         { --fa-primary-color: oklch(0.55 0.02 70);  --fa-secondary-color: oklch(0.78 0.12 70);  --fa-secondary-opacity: 0.5; }
.dark .icon-temperature-hot  { --fa-primary-color: oklch(0.65 0.20 30);  --fa-secondary-color: oklch(0.75 0.16 40);  --fa-secondary-opacity: 0.7; }
.dark .icon-temperature-frigid { --fa-primary-color: oklch(0.62 0.14 250); --fa-secondary-color: oklch(0.78 0.10 230); --fa-secondary-opacity: 0.7; }

/* ══════════════════════════════════════════════════════════════════════════
   PAGE LAYOUT
   ══════════════════════════════════════════════════════════════════════════ */

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-family: system-ui, -apple-system, sans-serif;
  background: oklch(0.95 0.005 250);
  color: oklch(0.20 0.02 250);
}

body {
  padding: 2rem;
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  font-size: 1.4rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 0.5rem;
}

.subtitle {
  text-align: center;
  font-size: 0.85rem;
  color: oklch(0.45 0.02 250);
  margin-bottom: 2rem;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}

.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.column {
  border-radius: 12px;
  padding: 1.5rem;
}

.column.light {
  background: oklch(1.00 0 0);
  border: 1px solid oklch(0.88 0.01 250);
  color: oklch(0.20 0.02 250);
}

.column.dark {
  background: oklch(0.22 0.015 250);
  border: 1px solid oklch(0.32 0.015 250);
  color: oklch(0.90 0.01 250);
}

.column h2 {
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 1.5rem;
  text-align: center;
}

.light h2 { color: oklch(0.45 0.02 250); }
.dark h2  { color: oklch(0.60 0.015 250); }

/* ── Category groups ──────────────────────────────────────────────────── */
.category {
  margin-bottom: 1.5rem;
}

.category h3 {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.75rem;
  padding-bottom: 0.25rem;
  border-bottom: 1px solid oklch(0.88 0.01 250);
}

.dark .category h3 {
  border-bottom-color: oklch(0.32 0.015 250);
  color: oklch(0.55 0.015 250);
}

.light .category h3 {
  color: oklch(0.50 0.02 250);
}

/* ── Icon row ─────────────────────────────────────────────────────────── */
.icon-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 0;
}

.icon-row + .icon-row {
  border-top: 1px solid oklch(0.92 0.005 250);
}

.dark .icon-row + .icon-row {
  border-top-color: oklch(0.28 0.01 250);
}

.icon-preview {
  font-size: 4rem;
  width: 5rem;
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}

.icon-label {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.icon-name {
  font-size: 0.85rem;
  font-weight: 600;
}

.icon-class {
  font-size: 0.7rem;
  font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
}

.light .icon-class { color: oklch(0.50 0.02 250); }
.dark .icon-class  { color: oklch(0.55 0.015 250); }

.icon-css-class {
  font-size: 0.65rem;
  font-family: ui-monospace, 'SF Mono', 'Menlo', monospace;
}

.light .icon-css-class { color: oklch(0.55 0.10 250); }
.dark .icon-css-class  { color: oklch(0.60 0.10 250); }

/* ── Responsive ───────────────────────────────────────────────────────── */
@media (max-width: 800px) {
  .columns {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<h1>EYC Weather — Duotone Icon Colors</h1>
<p class="subtitle">
  Preview of all weather condition icons in light and dark modes.
  Edit the <code>.icon-*</code> CSS classes to adjust colors.
  Each icon uses <code>--fa-primary-color</code>, <code>--fa-secondary-color</code>,
  and <code>--fa-secondary-opacity</code>.
</p>

<div class="columns">
  <!-- ═══ LIGHT MODE ═══════════════════════════════════════════════════ -->
  <div class="column light" id="light-column"></div>

  <!-- ═══ DARK MODE ════════════════════════════════════════════════════ -->
  <div class="column dark" id="dark-column"></div>
</div>

<script>
const ICON_GROUPS = [
  {
    title: 'Clear / Fair',
    icons: [
      { name: 'Sun',        fa: 'fa-sun',        css: 'icon-sun' },
      { name: 'Moon',       fa: 'fa-moon',       css: 'icon-moon' },
      { name: 'Sun Cloud',  fa: 'fa-sun-cloud',  css: 'icon-sun-cloud' },
      { name: 'Moon Cloud', fa: 'fa-moon-cloud', css: 'icon-moon-cloud' },
    ],
  },
  {
    title: 'Partly Cloudy',
    icons: [
      { name: 'Cloud Sun',  fa: 'fa-cloud-sun',  css: 'icon-cloud-sun' },
      { name: 'Cloud Moon', fa: 'fa-cloud-moon', css: 'icon-cloud-moon' },
      { name: 'Cloud',      fa: 'fa-cloud',      css: 'icon-cloud' },
    ],
  },
  {
    title: 'Rain',
    icons: [
      { name: 'Cloud Rain',      fa: 'fa-cloud-rain',      css: 'icon-cloud-rain' },
      { name: 'Cloud Sun Rain',  fa: 'fa-cloud-sun-rain',  css: 'icon-cloud-sun-rain' },
      { name: 'Cloud Moon Rain', fa: 'fa-cloud-moon-rain', css: 'icon-cloud-moon-rain' },
    ],
  },
  {
    title: 'Snow / Ice',
    icons: [
      { name: 'Cloud Snow',  fa: 'fa-cloud-snow',  css: 'icon-cloud-snow' },
      { name: 'Cloud Sleet', fa: 'fa-cloud-sleet', css: 'icon-cloud-sleet' },
      { name: 'Cloud Hail',  fa: 'fa-cloud-hail',  css: 'icon-cloud-hail' },
    ],
  },
  {
    title: 'Thunderstorms',
    icons: [
      { name: 'Cloud Bolt',      fa: 'fa-cloud-bolt',      css: 'icon-cloud-bolt' },
      { name: 'Cloud Bolt Sun',  fa: 'fa-cloud-bolt-sun',  css: 'icon-cloud-bolt-sun' },
      { name: 'Cloud Bolt Moon', fa: 'fa-cloud-bolt-moon', css: 'icon-cloud-bolt-moon' },
    ],
  },
  {
    title: 'Severe',
    icons: [
      { name: 'Tornado',      fa: 'fa-tornado',      css: 'icon-tornado' },
      { name: 'Hurricane',    fa: 'fa-hurricane',    css: 'icon-hurricane' },
      { name: 'Snow Blowing', fa: 'fa-snow-blowing', css: 'icon-snow-blowing' },
    ],
  },
  {
    title: 'Visibility',
    icons: [
      { name: 'Cloud Fog', fa: 'fa-cloud-fog', css: 'icon-cloud-fog' },
      { name: 'Smog',      fa: 'fa-smog',      css: 'icon-smog' },
      { name: 'Sun Haze',  fa: 'fa-sun-haze',  css: 'icon-sun-haze' },
    ],
  },
  {
    title: 'Temperature',
    icons: [
      { name: 'Hot',    fa: 'fa-temperature-hot',    css: 'icon-temperature-hot' },
      { name: 'Frigid', fa: 'fa-temperature-frigid', css: 'icon-temperature-frigid' },
    ],
  },
];

function buildColumn(container, isDark) {
  const heading = document.createElement('h2');
  heading.textContent = isDark ? 'Dark Mode' : 'Light Mode';
  container.appendChild(heading);

  for (const group of ICON_GROUPS) {
    const section = document.createElement('div');
    section.className = 'category';

    const h3 = document.createElement('h3');
    h3.textContent = group.title;
    section.appendChild(h3);

    for (const icon of group.icons) {
      const row = document.createElement('div');
      row.className = 'icon-row';

      row.innerHTML = `
        <div class="icon-preview ${icon.css}">
          <i class="fa-sharp-duotone fa-solid ${icon.fa}"></i>
        </div>
        <div class="icon-label">
          <div class="icon-name">${icon.name}</div>
          <div class="icon-class">${icon.fa}</div>
          <div class="icon-css-class">.${icon.css}</div>
        </div>
      `;

      section.appendChild(row);
    }

    container.appendChild(section);
  }
}

buildColumn(document.getElementById('light-column'), false);
buildColumn(document.getElementById('dark-column'), true);
</script>
</body>
</html>
