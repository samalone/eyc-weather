# /eyc-weather on the legacy domains, through the shared edge Gateway on the pc
# cluster (defined in the ProperCourse repo, kubernetes/edge/). Replaces
# ingress.yaml at the cutover (ProperCourse bead pc-foh.7.4). The longer
# prefix wins over ProperCourse's catch-all redirects for these hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eyc-weather
  namespace: default
spec:
  parentRefs:
    - name: edge
      sectionName: https
  hostnames:
    - proper-course.app
    - proper-score.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /eyc-weather
      backendRefs:
        - name: eyc-weather
          port: 80
      # Envoy's default route timeout is 15s; 60s matches ingress-nginx.
      timeouts:
        request: 60s
