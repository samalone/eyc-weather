# Kubernetes Secret template for EYC Weather production.
#
# This file is checked into git and contains NO secrets — only 1Password
# secret references. Run `scripts/inject-k8s-secret.sh` to expand it into
# `secret.yaml` (gitignored), which holds the real resolved values.
#
# `stringData` values are plain text; Kubernetes base64-encodes them on apply.
apiVersion: v1
kind: Secret
metadata:
  name: eyc-weather-secrets
  namespace: default
  labels:
    app: eyc-weather
type: Opaque
stringData:
  WUNDERGROUND_STATION_ID: "KRICRANS68"
  WUNDERGROUND_API_KEY: "op://tech/Weather Underground API/credential"
  RECALIBRATE_SECRET: "op://tech/eyc-weather/password"
